name: Build ScreenReader

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish ScreenReader.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ScreenReader
          path: ScreenReader/bin/Release/net8.0-windows/win-x64/publish/ScreenReader.exe
